name: claire
x-app: &app
  build: .
  image: claire:0.1.0
  user: "${PUID:-10001}:${PGID:-10001}"
  read_only: true
  tmpfs: ["/tmp:size=64m,noexec,nosuid"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &environment
    CLAIRE_DATABASE_URL_FILE: /run/secrets/database_url
    CLAIRE_ORIGIN: ${CLAIRE_ORIGIN:-https://localhost}
    CLAIRE_SECURE_COOKIES: ${CLAIRE_SECURE_COOKIES:-true}
  secrets: [database_url]
  volumes:
    - ${CLAIRE_DATA_PATH:-./data/archive}:/data
  networks: [backend]
  mem_limit: 1g
  cpus: 2
services:
  claire-db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: claire
      POSTGRES_USER: claire_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ${CLAIRE_DB_PATH:-./data/postgres}:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U claire_owner -d claire"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    environment:
      <<: *environment
      CLAIRE_DATABASE_URL_FILE: /run/secrets/owner_database_url
    secrets: [owner_database_url]
    depends_on:
      claire-db: {condition: service_healthy}
  claire-app:
    <<: *app
    ports: ["127.0.0.1:${CLAIRE_PORT:-8000}:8000"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  claire-worker:
    <<: *app
    command: [python, -m, claire.worker]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
  claire-ollama:
    image: ollama/ollama:0.6.2
    profiles: [local-ai]
    volumes: ["${CLAIRE_MODELS_PATH:-./data/models}:/root/.ollama"]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
networks:
  backend:
secrets:
  db_password:
    file: ${CLAIRE_SECRET_PATH:-./data/secrets}/db_password
  database_url:
    file: ${CLAIRE_SECRET_PATH:-./data/secrets}/database_url
  owner_database_url:
    file: ${CLAIRE_SECRET_PATH:-./data/secrets}/owner_database_url
