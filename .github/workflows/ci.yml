name: Validate
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: claire_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check apps/backend tests
      - run: uv run pytest
        env:
          CLAIRE_TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable-ci-password@localhost/claire_test
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv sync --frozen --python 3.12
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows against real backend
        working-directory: .
        run: |
          uv run python scripts/serve_smoke.py > /tmp/claire-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/healthz; then break; fi
            sleep 1
          done
          cd apps/frontend
          npx playwright test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claire:ci .
      - name: Test installed container runtime
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$PWD/scripts/container_smoke.py:/checks/container_smoke.py:ro" \
            claire:ci python /checks/container_smoke.py
      - name: Scan image security (HIGH and CRITICAL block release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: claire:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: json
          output: trivy-report.json
      - name: Summarize image security
        if: always()
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          report = Path('trivy-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Container security\n\n')
              if not report.exists():
                  summary.write('No scan report produced. Check the Trivy step for a scanner/setup error.\n')
              else:
                  results = json.loads(report.read_text()).get('Results', [])
                  vulnerabilities = [v for r in results for v in r.get('Vulnerabilities', [])]
                  counts = collections.Counter(v['Severity'] for v in vulnerabilities)
                  summary.write(f"HIGH: {counts['HIGH']} · CRITICAL: {counts['CRITICAL']}\n\n")
                  summary.write('The scan blocks release on these findings. A version notice or cleanup step is not the cause. Download the image-security artifact for details.\n\n')
                  summary.write('| Package | Findings | Fixed versions reported |\n|---|---:|---|\n')
                  packages = collections.defaultdict(list)
                  for vulnerability in vulnerabilities:
                      packages[vulnerability['PkgName']].append(vulnerability)
                  for name, findings in sorted(packages.items()):
                      versions = sorted({v['FixedVersion'] for v in findings if v.get('FixedVersion')})
                      summary.write(f"| {name} | {len(findings)} | {', '.join(versions) or 'None reported by scanner'} |\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security
          path: trivy-report.json
          if-no-files-found: warn
      - uses: anchore/sbom-action@v0.24.3
        if: always()
        with:
          image: claire:ci
          format: spdx-json
          output-file: claire.spdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: claire.spdx.json
