name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable semantic version tag, for example v0.1.0
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate stable version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION"; then
            echo 'Release exists; refusing replacement.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/claire:${{ inputs.version }}
      - name: Draft release with immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image digest: `%s`\n\nRead docs/install.md for migration and rollback precautions.\n' "$DIGEST" > /tmp/release-notes.md
          gh release create "$VERSION" --verify-tag --draft --generate-notes --notes-file /tmp/release-notes.md
